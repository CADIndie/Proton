name: Build Proton-ARM64-Android

on:
  push:
    branches: [ "proton_11.0" ]
  pull_request:
    branches: [ "proton_11.0" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-24.04-arm64

    steps:
    - uses: actions/checkout@v4
    - name: Set git credentials
      run: git config --global url.https://${{ secrets.PAT }}@github.com/.insteadOf https://github.com/
    - name: Update submodules
      run: git submodule update --init --recursive
    - name: make redistribute build
      run: make redist
    - name: Upload Proton
      uses: actions/upload-artifact@v4
      with:
        name: proton-redist-${{matrix.arch}}
        path: build/build-proton_11.0-local/dist
    
